<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Interaktive Animation</title>

  <!-- CSS einbinden -->
  <link rel="stylesheet" href="Abgabe2.css">
</head>
<body>

  <!-- Canvas -->
  <canvas id="canvas"></canvas>

  <!-- Anleitung -->
  <div class="hud">
    <b>Interaktive Canvas Animation:</b><br>
    Maus bewegen: Ball wird angezogen<br>
    Klick: Ball springt zur Maus<br>
    Leertaste: Pause / Weiter
    <div id="status"></div>
  </div>

  <!-- JavaScript einbinden -->
  <script src="Abgabe2.js"></script>
</body>
</html>
